      <polygon points="70.5,61.2 81,67 70.5,72.8 60,67" fill="#2C3539" stroke="#141618" stroke-width="0.5" />
      <polygon points="81,67 91.5,72.8 81,78.6 70.5,72.8" fill="#D5CDC0" stroke="#141618" stroke-width="0.5" />
      <polygon points="28.5,49.6 39,55.4 28.5,61.199999999999996 18,55.4" fill="#2C3539" stroke="#141618" stroke-width="0.5" />
      <polygon points="39,55.400000000000006 49.5,61.2 39,67 28.5,61.2" fill="#D5CDC0" stroke="#141618" stroke-width="0.5" />
      <polygon points="49.5,61.2 60,67 49.5,72.8 39,67" fill="#2C3539" stroke="#141618" stroke-width="0.5" />
      <polygon points="60,67 70.5,72.8 60,78.6 49.5,72.8" fill="#D5CDC0" stroke="#D4AF37" stroke-width="1.4" />
      <polygon points="70.5,72.8 81,78.6 70.5,84.39999999999999 60,78.6" fill="#2C3539" stroke="#141618" stroke-width="0.5" />
