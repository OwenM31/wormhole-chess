  <g class="pawn-piece" transform="translate(70.5, 67) scale(0.75)" opacity="0.85">
    <ellipse cx="0" cy="0.8" rx="4.0" ry="2.2" fill="#0A0B0C" opacity="0.6" />
    <ellipse cx="0" cy="0.2" rx="3.6" ry="2.0" fill="url(#goldB_base)" stroke="#16181A" stroke-width="0.5" />
    <path d="M -2.2 -0.2 C -2.2 -3.0 -1.2 -6.5 -0.8 -9.0 L 0.8 -9.0 C 1.2 -6.5 2.2 -3.0 2.2 -0.2 Z" fill="url(#goldB_focus)" stroke="#16181A" stroke-width="0.5" />
    <ellipse cx="0" cy="-9.2" rx="2.2" ry="1.2" fill="url(#goldB_base)" stroke="#16181A" stroke-width="0.4" />
    <circle cx="0" cy="-12.2" r="2.2" fill="url(#goldB_focus)" stroke="#16181A" stroke-width="0.5" />
    <circle cx="-0.6" cy="-12.8" r="0.7" fill="#FFFDF7" opacity="0.9" />
  </g>
  
  <!-- RADIANT PIERCING BEAM -->
  <line x1="60" y1="66.8" x2="60" y2="43.6" stroke="#A855F7" stroke-width="3.2" stroke-linecap="round" opacity="0.85" />
  <line x1="60" y1="66.8" x2="60" y2="43.6" stroke="#FFFDF7" stroke-width="1.2" stroke-linecap="round" />
  
  <ellipse cx="60" cy="49.6" rx="6.5" ry="3.5100000000000002" fill="none" stroke="#D4AF37" stroke-width="1.3" stroke-dasharray="2 1.5" />
  <polygon points="60,52.4 57.2,47.4 62.8,47.4" fill="#D4AF37" />

  <!-- STANDING STAUNTON BISHOP PIECE -->
  
  <g class="bishop-piece" transform="translate(60, 72.8) scale(1)" opacity="1">
    <!-- Ground drop shadow -->
    <ellipse cx="0" cy="1.0" rx="5.4" ry="2.8" fill="#0A0B0C" opacity="0.65" />
    <!-- Turned circular plinth base -->
    <ellipse cx="0" cy="0.2" rx="5.0" ry="2.75" fill="url(#goldB_base)" stroke="#16181A" stroke-width="0.6" />
    <ellipse cx="0" cy="-0.8" rx="4.0" ry="2.2" fill="url(#goldB_focus)" stroke="#16181A" stroke-width="0.4" />
    <ellipse cx="0" cy="-1.8" rx="3.0" ry="1.6" fill="url(#goldB_base)" />
    <!-- Tapered pedestal neck -->
    <path d="
      M -2.4 -1.8
      C -2.4 -5.5 -1.2 -9.5 -0.9 -12.0
      L 0.9 -12.0
      C 1.2 -9.5 2.4 -5.5 2.4 -1.8
      Z
    " fill="url(#goldB_focus)" stroke="#16181A" stroke-width="0.6" />
    <!-- Waist fillet collar -->
    <ellipse cx="0" cy="-12.0" rx="2.5" ry="1.2" fill="url(#goldB_base)" stroke="#16181A" stroke-width="0.5" />
    <!-- Fluted mitre head -->
    <path d="
      M -2.2 -12.0
      C -3.2 -14.0 -2.6 -17.5 0 -19.0
      C 2.6 -17.5 3.2 -14.0 2.2 -12.0
      Z
    " fill="url(#goldB_focus)" stroke="#16181A" stroke-width="0.6" />
    <!-- Authentic diagonal mitre cleft cut -->
    <path d="M 0 -13.0 L 2.2 -15.5" stroke="#16181A" stroke-width="0.9" stroke-linecap="round" />
    <!-- Finial orb atop mitre -->
    <circle cx="0" cy="-19.6" r="1.1" fill="url(#goldB_base)" stroke="#16181A" stroke-width="0.4" />
    <circle cx="-0.3" cy="-19.9" r="0.4" fill="#FFFDF7" opacity="0.9" />
  </g>
</svg>