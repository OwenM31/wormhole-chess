      <polygon points="60,32.2 70.5,38 60,43.8 49.5,38" fill="#D5CDC0" stroke="#141618" stroke-width="0.5" />
      <polygon points="70.5,38 81,43.8 70.5,49.599999999999994 60,43.8" fill="#2C3539" stroke="#141618" stroke-width="0.5" />
      <polygon points="81,43.800000000000004 91.5,49.6 81,55.4 70.5,49.6" fill="#D5CDC0" stroke="#141618" stroke-width="0.5" />
