      <polygon points="60,43.800000000000004 70.5,49.6 60,55.4 49.5,49.6" fill="rgba(212, 175, 55, 0.42)" stroke="#D4AF37" stroke-width="1.8" />
      <polygon points="70.5,49.6 81,55.4 70.5,61.199999999999996 60,55.4" fill="#2C3539" stroke="#141618" stroke-width="0.5" />
      <polygon points="81,55.400000000000006 91.5,61.2 81,67 70.5,61.2" fill="#D5CDC0" stroke="#141618" stroke-width="0.5" />
      <polygon points="91.5,61.2 102,67 91.5,72.8 81,67" fill="#2C3539" stroke="#141618" stroke-width="0.5" />
      <polygon points="39,43.800000000000004 49.5,49.6 39,55.4 28.5,49.6" fill="#D5CDC0" stroke="#141618" stroke-width="0.5" />
