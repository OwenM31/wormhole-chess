  <!-- STANDING STAUNTON PAWN PIECE -->
  
  <g class="pawn-piece" transform="translate(49.5, 67) scale(1)" opacity="1">
    <!-- Ground drop shadow -->
    <ellipse cx="0" cy="1.0" rx="5.4" ry="2.8" fill="#0A0B0C" opacity="0.65" />
    <!-- Turned circular plinth base -->
    <ellipse cx="0" cy="0.2" rx="5.0" ry="2.75" fill="url(#goldP_base)" stroke="#16181A" stroke-width="0.6" />
    <ellipse cx="0" cy="-0.8" rx="4.0" ry="2.2" fill="url(#goldP_focus)" stroke="#16181A" stroke-width="0.4" />
    <ellipse cx="0" cy="-1.8" rx="3.0" ry="1.6" fill="url(#goldP_base)" />
    <!-- Pedestal trunk with concave neck and waist collar -->
    <path d="
      M -2.6 -1.8
      C -2.6 -5.2 -1.4 -9.0 -1.1 -11.4
      L 1.1 -11.4
      C 1.4 -9.0 2.6 -5.2 2.6 -1.8
      Z
    " fill="url(#goldP_focus)" stroke="#16181A" stroke-width="0.6" />
    <!-- Waist fillet collar -->
    <ellipse cx="0" cy="-11.4" rx="2.4" ry="1.2" fill="url(#goldP_base)" stroke="#16181A" stroke-width="0.5" />
    <!-- Spherical cap -->
    <circle cx="0" cy="-14.5" r="2.8" fill="url(#goldP_focus)" stroke="#16181A" stroke-width="0.6" />
    <!-- Specular highlight -->
    <circle cx="-0.8" cy="-15.3" r="0.9" fill="#FFFDF7" opacity="0.9" />
  </g>
